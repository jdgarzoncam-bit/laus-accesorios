name: Static QA package
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check assets/storefront.js
          node --check assets/admin.js
          node --check assets/motion.js
          node --check assets/config.js
          node --check backend/functions/api/index.mjs
      - name: Bundle Neon Function dependencies
        run: |
          cd backend/functions/api
          npm install --no-audit --no-fund
          npx esbuild index.mjs --bundle --platform=node --format=esm --target=node24 --outfile=dist/index.mjs --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
          mkdir -p ../../../function-bundle
          cp dist/index.mjs ../../../function-bundle/index.mjs
          cd ../../../function-bundle
          zip -q ../laus-neon-function.zip index.mjs
      - name: Validate required static files
        run: |
          test -s index.html
          test -s admin.html
          test -s assets/storefront.css
          test -s assets/storefront.js
          test -s assets/admin.css
          test -s assets/admin.js
      - name: Package static QA project
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          zip -r laus-accesorios-qa.zip . \
            -x '.git/*' '.github/*' '.env' '.env.local' '.env.*.local' '*.log'
      - name: Upload QA ZIP
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        uses: actions/upload-artifact@v4
        with:
          name: laus-accesorios-qa
          path: laus-accesorios-qa.zip
          if-no-files-found: error
          retention-days: 14      - name: Upload Neon Function bundle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        uses: actions/upload-artifact@v4
        with:
          name: laus-neon-function-bundle
          path: laus-neon-function.zip
          if-no-files-found: error
          retention-days: 14
